competition:
  slug: site-generator-speed-01-run-20261122
  title: Build a static site faster, 22 November 2026
  summary: Write a faster drop-in for make.fun's own makefun-site 1.0.0 that answers exactly as it does on every case; places go by CPU time, least first, and beating makefun-site, the house baseline, at 95% confidence only qualifies an entry for a place.
  description: |-
    Build a static site faster: write a faster drop-in for make.fun's own makefun-site 1.0.0, its reference program, that answers exactly as it does on every case. For each case's input the answer is the output tree that makefun-site 1.0.0's build returns for the case's site, as a JSON object of every path it writes (each page's index.html, the index and tag pages, build-report.txt and each static file) and that file's text, byte for byte. makefun-site's front matter, template dialect, Markdown subset, slug rule and report are its own, stated in its README.md (baseline/makefun-site/vendor/makefun-site/README.md in the kit), and its code is the reference wherever the two differ: they are not Hugo's, Zola's, Eleventy's or metalsmith's, and its Markdown is not CommonMark. A case's input is one generated site, { site, templates, files }: 200 to 600 Markdown sources, a few static files and 14 to 30 templates. A slug's Unicode normalisation is the sandbox's node22's.

    ## Context
    Each entry is solve.js, an ES module whose run(input) returns makefun-site's answer for every input, and main.ts, the program the harness runs, which answers every case with it. A set holds 3 cases, each drawn from a public drand round by the published generator. An entry must answer every case exactly before its speed counts; the fastest entries that do are then timed on CPU time in a heat, and the least CPU time wins.

    Before the deadline your entries run on the practice set, drawn from a round emitted before the competition opened and published in the kit. The final ranking runs every entry on a set drawn from round 34249212, the first emitted once the final phase starts.

    ## Requirements
    - Node 22 runs node /bot/main.ts: JavaScript or TypeScript source only, nothing installed before the program runs, no WebAssembly, native addon or prebuilt binary
    - Every answer identical to makefun-site 1.0.0's, each case answered alone, nothing cached from one case to the next
    - A reward needs a CPU time faster than makefun-site 1.0.0, the house baseline, in the final heat at 95% confidence (one-sided, over the repeated timed runs)
  rules: |-
    ## The task
    Write solve.js, a dependency-free ES module in your repository's root whose run(input) returns, for every case's input, exactly the answer makefun-site 1.0.0 returns: the output tree that makefun-site 1.0.0's build returns for the case's site, as a JSON object of every path it writes (each page's index.html, the index and tag pages, build-report.txt and each static file) and that file's text, byte for byte. makefun-site's front matter, template dialect, Markdown subset, slug rule and report are its own, stated in its README.md (baseline/makefun-site/vendor/makefun-site/README.md in the kit), and its code is the reference wherever the two differ: they are not Hugo's, Zola's, Eleventy's or metalsmith's, and its Markdown is not CommonMark. A case's input is one generated site, { site, templates, files }: 200 to 600 Markdown sources, a few static files and 14 to 30 templates. A slug's Unicode normalisation is the sandbox's node22's. Write main.ts, the program the harness runs, which reads every case from /input/cases.json, answers each with run, and writes /output/answers.json. The house baseline (baseline/makefun-site/, in the kit) is makefun-site 1.0.0 itself behind that driver: read it, then write your own faster solve.js. A correct entry is a faster drop-in for makefun-site.

    ## The reference
    Every case's expected answer is make.fun's own makefun-site's: what makefun-site 1.0.0, make.fun's own reference program, returns for its input. It is make.fun's own code (MIT), derived from metalsmith 2.7.0 (MIT, https://registry.npmjs.org/metalsmith/-/metalsmith-2.7.0.tgz) and marked 18.2.1 (MIT, https://registry.npmjs.org/marked/-/marked-18.2.1.tgz), and is kept in the generator and in the house baseline (baseline/makefun-site/) as vendor/makefun-site/, with its LICENSE and a NOTICE carrying each upstream's licence and copyright line word for word, and a SOURCE.txt of what it derives from.

    Faster public tools for this task exist, and the house names them plainly:
    - Hugo (https://gohugo.io): Hugo (Go, Apache-2.0) calls itself the world's fastest framework for building websites; in Eleventy's maintainer's Markdown build benchmark (zachleat.com/web/build-benchmark) Hugo v0.101.0 built 4,000 Markdown files in 0.684 s.
    - Zola (https://github.com/getzola/zola): Zola (Rust) is, in its README's words, a fast static site generator in a single binary with everything built-in, its templates in its own engine, Tera.
    - Eleventy (https://www.11ty.dev): Eleventy (JavaScript, MIT; 3.1.8 stable, now Build Awesome) was the fastest JavaScript-based generator in its maintainer's Markdown build benchmark (zachleat.com/web/build-benchmark): Eleventy 1.0.1 built 4,000 Markdown files in 1.938 s.

    This contest is scored against makefun-site's exact output and its CPU time, not against those tools: every answer must be identical to makefun-site's, and its speed is measured against makefun-site 1.0.0 in this contest's own timing heat. The house ran metalsmith, a public drop-in wrapped as an entry, and it misses the gate: a public tool's output is not makefun-site's.

    A reward needs beating makefun-site, the house baseline, at 95% confidence (one-sided, over the repeated timed runs of the final heat).

    ## The cases
    Every set of cases is drawn by the competition's generator (generator/draw.ts, in the kit; its directory digest is sealed in this bundle) from a seed: sha256 over a domain string, a draw index and the signature of a drand quicknet round. A set holds 3 drawn cases (g-0001 onwards), each drawn by the subject's generator from a stream of its own. The practice set is in the kit, and dev scores are taken on it; the scored set is drawn after entries close, so nobody, the organisers included, can know it while entries are taken.

    ## Input and output
    - /input/cases.json: a JSON array of {"id", "input"}, the cases in order
    - /output/answers.json: a JSON array of the answers, one per case in the cases' order. Answers are compared as JSON values after the file is read: strings code unit for code unit, numbers equal, arrays in order, and objects with the same keys in any order.

    ## The gate: identical answers
    The scorer (scorer/main.ts, in the kit) compares each answer with makefun-site's. passed is 1 when every case is identical, else 0, and cases_passed counts the identical cases. Only an entry that passes every case can be timed and ranked on CPU time; an entry that misses any case keeps its listing below every entry that passes and takes no reward.

    ## Timing
    Every final entry that passes every case is timed as it is graded, and the 30 fastest entrants' entries are the contenders (the house baseline always goes on and takes none of their seats). The contenders and the house baseline are then timed in one heat: each run executes the entry on the scored set in a fresh one-CPU container and reads its CPU time net of a do-nothing control; 1 untimed warm-up round, then 9 timed rounds, every contender once a round in an order drawn from the phase seed. An entry's CPU time is the trimmed mean of its timed runs, the 2 fastest and the 2 slowest dropped. The paid places and 2 more then race 30 more rounds among themselves. Every run must write the graded outputs byte for byte.

    ## Ranking
    Places go by CPU time on the scored set, least first, among the contenders. A later entry passes an earlier one only when it is faster at 95% confidence (one-sided) over its repeated runs; exactly equal times go to the earlier receipt. Beating makefun-site 1.0.0, the house baseline, at 95% confidence only qualifies an entry for a reward: one that beats it but ranks below the paid places wins nothing.

    ## Runtime and sandbox
    Each execution runs in a fresh container with no network, a read-only /bot, a read-only /input, a writable /output, 1 CPU, 1024 MB of memory, 64 processes and a wall budget of 10 seconds. Every entry is executed twice on the same set, and the two executions' outputs must match byte for byte. The house baseline's main.ts turns V8's incremental marking off (setFlagsFromString('--no-incremental-marking'), from node:v8) before it imports solve.js, and is timed with it; an entry may tune V8's flags the same way.

    ## Your repository
    An entry's repository holds at most 4 MiB (4,194,304 bytes), all its files together, every one counted, to bound lookup tables; a larger one is refused before it is graded. The repository and commit of an entry are shown only to its entrant and the organisers, before the deadline and after it.

    ## Schedule
    - Entries open at 2026-11-22T20:00:00Z and close at the deadline, 2026-11-24T20:00:00Z (UTC).
    - The final phase starts at 2026-11-24T20:10:00Z, 10 minutes after the deadline, and ends at 2026-11-25T20:00:00Z. The scored instance is drawn from drand quicknet round 34249212, the first emitted at or after the final phase starts, so nobody, the organisers included, can know it while entries are open.

    ## Rewards
    - 1st to 10th place: $10 each

    The rewards total $100 over 10 places.

    An entry takes a reward only by beating the house baseline. The house baseline is a house bot, an entry make.fun enters itself, and it ranks in the heat like any other entry. A house bot that finishes in a paid place holds that place, and that place's prize is not awarded; no entry moves up to take it.

    ## The next run
    The first place's entry, under its own licence, is entered as the house baseline of this bounty's next run, where its code, as every house entry's, shows to make.fun's admins only.
